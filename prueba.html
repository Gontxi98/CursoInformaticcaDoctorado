<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelador de Tamaño de Coche</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #333;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }

        .controls {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }

        .val-display {
            font-size: 0.9rem;
            color: #007BFF;
            font-weight: bold;
        }

        .canvas-area {
            flex: 1;
            min-width: 300px;
            height: 300px;
            background-color: #e9ecef;
            border: 2px dashed #ccc;
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* El Coche (Vista Superior) */
        .car {
            background-color: #dc3545;
            border-radius: 15px;
            position: relative;
            transition: width 0.1s, height 0.1s;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        /* Parabrisas delantero */
        .car::before {
            content: '';
            position: absolute;
            top: 20%;
            right: 15px;
            width: 15%;
            height: 60%;
            background-color: #a8dadc;
            border-radius: 4px;
        }

        /* Luces delanteras */
        .car-lights {
            position: absolute;
            right: -2px;
            top: 10%;
            bottom: 10%;
            width: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .light {
            width: 5px;
            height: 10px;
            background-color: #ffca3a;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <h1>Modelador de Tamaño de Coche</h1>
    <p>Ajusta las dimensiones del vehículo en tiempo real (Vista superior)</p>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="largo">Largo (Eje X):</label>
                <input type="range" id="largo" min="100" max="280" value="180">
                <div class="val-display"><span id="largo-val">180</span> px</div>
            </div>

            <div class="control-group">
                <label for="ancho">Ancho (Eje Y):</label>
                <input type="range" id="ancho" min="60" max="180" value="100">
                <div class="val-display"><span id="ancho-val">100</span> px</div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="car" class="car">
                <div class="car-lights">
                    <div class="light"></div>
                    <div class="light"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Obtener elementos del DOM
        const inputLargo = document.getElementById('largo');
        const inputAncho = document.getElementById('ancho');
        const txtLargo = document.getElementById('largo-val');
        const txtAncho = document.getElementById('ancho-val');
        const car = document.getElementById('car');

        // Función para actualizar las dimensiones
        function actualizarCoche() {
            const largo = inputLargo.value;
            const ancho = inputAncho.value;

            // Aplicar valores al texto informativo
            txtLargo.textContent = largo;
            txtAncho.textContent = ancho;

            // Aplicar estilos CSS en tiempo real al coche
            car.style.width = largo + 'px';
            car.style.height = ancho + 'px';
        }

        // Escuchar los eventos de movimiento de los sliders
        inputLargo.addEventListener('input', actualizarCoche);
        inputAncho.addEventListener('input', actualizarCoche);

        // Inicializar el tamaño al cargar la página
        actualizarCoche();
    </script>

</body>
</html>
